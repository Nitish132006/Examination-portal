{% extends "base.html" %}{% block content %}<div class="form-card"><h2>Create account</h2><form method="post"><label>Full name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password (minimum 6 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><label>Register as</label><select class="form-select mb-3" name="role"><option value="student">Student</option><option value="examiner">Examiner</option></select><label>Department / Class</label><input class="form-control mb-3" name="department"><button class="btn btn-primary w-100">Register</button></form></div>{% endblock %}
