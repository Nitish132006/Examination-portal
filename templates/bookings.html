{% extends "base.html" %}{% block content %}<h2>All Bookings</h2><form class="d-flex mb-3"><input class="form-control me-2" name="q" placeholder="Search student name, email or booking ID" value="{{ request.args.get('q','') }}"><button class="btn btn-outline-primary">Search</button></form><table class="table table-striped"><tr><th>ID</th><th>Student</th><th>Exam</th><th>Slot</th><th>Status</th><th>Reschedule</th></tr>{% for b in bookings %}<tr><td>{{ b.id }}</td><td>{{ b.student.name }}<br><small>{{ b.student.email }}</small></td><td>{{ b.slot.exam.name }}</td><td>{{ b.slot.exam_date }} {{ b.slot.start_time }}</td><td>{{ b.status }}</td><td><form method="post" action="{{ url_for('reschedule',booking_id=b.id) }}" class="d-flex gap-1"><select class="form-select form-select-sm" name="slot_id">{% for s in all_slots if s.exam_id==b.slot.exam_id %}<option value="{{ s.id }}" {% if s.id==b.slot_id %}selected{% endif %}>{{ s.exam_date }} {{ s.start_time }} ({{ s.seats_left }} left)</option>{% endfor %}</select><button class="btn btn-sm btn-primary">Move</button></form></td></tr>{% endfor %}</table>{% endblock %}
