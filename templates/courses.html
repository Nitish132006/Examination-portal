{% extends "base.html" %}{% block content %}<h2>Manage Courses</h2><form method="post" class="card card-body mb-4"><div class="row g-2"><div class="col-md-2"><input class="form-control" name="code" placeholder="Course code" required></div><div class="col-md-3"><input class="form-control" name="name" placeholder="Course name" required></div><div class="col-md-5"><input class="form-control" name="description" placeholder="Description"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add course</button></div></div></form><table class="table"><tr><th>Code</th><th>Name</th><th>Status</th><th>Actions</th></tr>{% for c in courses %}<tr><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ 'Active' if c.active else 'Inactive' }}</td><td><form class="d-inline" method="post" action="{{ url_for('toggle_course',course_id=c.id) }}"><button class="btn btn-sm btn-outline-secondary">Toggle</button></form> <form class="d-inline" method="post" action="{{ url_for('delete_course',course_id=c.id) }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
