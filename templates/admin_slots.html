{% extends "base.html" %}{% block content %}<h2>All Examination Slots</h2><table class="table table-striped"><tr><th>Exam</th><th>Examiner</th><th>Date</th><th>Time</th><th>Capacity</th><th>Change examiner</th></tr>{% for s in slots %}<tr><td>{{ s.exam.name }}</td><td>{{ s.examiner.name }}</td><td>{{ s.exam_date }}</td><td>{{ s.start_time }}–{{ s.end_time }}</td><td>{{ s.booked_count }}/{{ s.capacity }}</td><td><form method="post" action="{{ url_for('change_slot_examiner',slot_id=s.id) }}" class="d-flex gap-1"><select class="form-select form-select-sm" name="examiner_id">{% for x in examiners %}<option value="{{ x.id }}" {% if x.id==s.examiner_id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select><button class="btn btn-sm btn-primary">Change</button></form></td></tr>{% endfor %}</table>{% endblock %}
