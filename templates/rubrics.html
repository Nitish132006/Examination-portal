{% extends "base.html" %}{% block content %}<h2>Rubric: {{ exam.name }}</h2><form method="post" class="card card-body mb-3"><div class="row g-2"><div class="col-md-4"><input class="form-control" name="criterion" placeholder="Criterion" required></div><div class="col-md-2"><input class="form-control" type="number" step="0.5" min="0.5" name="max_marks" placeholder="Max marks" required></div><div class="col-md-2"><input class="form-control" type="number" step="0.1" name="weightage" value="1" placeholder="Weightage"></div><div class="col-md-3"><input class="form-control" name="description" placeholder="Description"></div><div class="col-md-1"><button class="btn btn-primary">Add</button></div></div></form><table class="table"><tr><th>Criterion</th><th>Max marks</th><th>Weightage</th><th>Description</th><th></th></tr>{% for r in exam.rubrics %}<tr><td>{{ r.criterion }}</td><td>{{ r.max_marks }}</td><td>{{ r.weightage }}</td><td>{{ r.description }}</td><td><form method="post" action="{{ url_for('delete_rubric',rubric_id=r.id) }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
