{% extends "base.html" %}{% block content %}<div class="form-card"><h2>My Profile</h2><form method="post"><label>Name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label>Email (cannot be changed)</label><input class="form-control mb-3" value="{{ current_user.email }}" disabled><label>Department / Class</label><input class="form-control mb-3" name="department" value="{{ current_user.department or '' }}"><button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
