{% extends "base.html" %}{% block content %}<h2>Search Students and Examiners</h2><form class="d-flex mb-3"><input class="form-control me-2" name="q" placeholder="Name, email or user ID" value="{{ request.args.get('q','') }}"><button class="btn btn-primary">Search</button></form><table class="table"><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Department / Class</th><th>Status</th></tr>{% for u in users %}<tr><td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.department }}</td><td>{{ 'Active' if u.active else 'Inactive' }}</td></tr>{% endfor %}</table>{% endblock %}
